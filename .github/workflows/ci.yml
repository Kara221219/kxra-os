name: KXRA OS CI

on:
  pull_request:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: kxra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run disposable full verification
        run: npm run test:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies
        run: npm audit

      - name: Export validated synthetic failure summaries
        id: safe_diagnostics
        if: failure()
        run: node scripts/export-safe-ci-diagnostics.mjs

      - name: Retain validated synthetic failure summaries
        if: failure() && steps.safe_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: safe-ci-diagnostics-export/*.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
